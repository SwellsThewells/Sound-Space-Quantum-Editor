name: Desktop release

# Every update to master that changes the editor, the map player, the desktop app or the changelog builds the Windows
# desktop app (Sound Space Quantum Editor Plus) and publishes it as a new GitHub release: an installer and a portable
# .exe, with the newest changelog entry as the release notes. Versions are <major.minor from desktop/package.json>.<run>.

on:
  push:
    branches: [master]
    paths:
      - 'Web Editor/**'
      - 'Web Player/**'
      - 'desktop/**'
      - 'changelog'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./desktop/package.json').version")
          version="${base%.*}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd desktop && npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Release notes
        shell: bash
        run: node desktop/release-notes.js > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sound Space Quantum Editor Plus ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            desktop/dist/*.exe
