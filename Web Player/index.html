<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Sound Space Quantum Editor Plus - Map Player</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
    @font-face {
        font-family: SSQEMain;
        src: url('../Web%20Editor/assets/fonts/main.ttf') format('truetype');
    }
    @font-face {
        font-family: SSQESemibold;
        src: url('../Web%20Editor/assets/fonts/semibold.ttf') format('truetype');
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
    }
    body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; overscroll-behavior: none; }

    /* the menu and settings are drawn on this canvas with the editor's GUI */
    #editor-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    #game, #overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: none;
        z-index: 30;
    }
    #overlay { pointer-events: none; }
    body.playing #game, body.playing #overlay { display: block; }
    body.playing { cursor: none; }

    #touch-input {
        position: fixed;
        z-index: 15;
        margin: 0;
        padding: 0 6px;
        background: rgb(26, 26, 26);
        color: #fff;
        border: 2px solid #fff;
        border-radius: 6px;
        outline: none;
        font-family: SSQESemibold, sans-serif;
        user-select: text;
    }

    #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgb(30, 30, 30);
        color: #fff;
        font: 22px SSQESemibold, sans-serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
    }
    #rotate-hint .phone {
        width: 54px;
        height: 90px;
        border: 4px solid #fff;
        border-radius: 10px;
        animation: rotate-phone 2s ease-in-out infinite;
    }
    @keyframes rotate-phone { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    #rotate-hint button {
        font: 22px SSQESemibold, sans-serif;
        color: #fff;
        background: rgb(26, 26, 26);
        border: 2px solid rgb(52, 52, 52);
        border-radius: 8px;
        padding: 12px 22px;
    }
    #rotate-hint .skip { background: none; border: none; color: #aaa; font-size: 16px; text-decoration: underline; }
    @media (orientation: portrait) and (pointer: coarse) {
        body:not(.portrait-ok):not(.playing) #rotate-hint { display: flex; }
    }
</style>
</head>
<body>
<canvas id="editor-canvas"></canvas>
<canvas id="game"></canvas>
<canvas id="overlay"></canvas>

<!-- phones in portrait: the 16:9 menu needs landscape -->
<div id="rotate-hint">
    <div class="phone"></div>
    <div>Turn your device sideways to use the map player.</div>
    <button type="button" id="rotate-fullscreen">GO FULLSCREEN</button>
    <button type="button" class="skip" id="rotate-skip">Use it in portrait anyway</button>
</div>

<!-- the editor's GUI toolkit, fonts and click sounds -->
<script src="../Web%20Editor/js/sounds.js?v=49"></script>
<script src="../Web%20Editor/js/fontmetrics.js?v=49"></script>
<script src="../Web%20Editor/js/model.js?v=49"></script>
<script src="../Web%20Editor/js/formats.js?v=49"></script>
<script src="../Web%20Editor/js/audio.js?v=49"></script>
<script src="../Web%20Editor/js/settings.js?v=49"></script>
<script src="../Web%20Editor/js/gui.js?v=49"></script>
<script src="../Web%20Editor/js/touch.js?v=49"></script>
<script src="../Web%20Editor/js/screens.js?v=49"></script>
<script src="../Web%20Editor/js/customassets.js?v=49"></script>
<script src="../Web%20Editor/js/stats.js?v=49"></script>
<script src="../Web%20Editor/js/starrating.js?v=49"></script>
<script src="../Web%20Editor/js/automapper.js?v=49"></script>

<script src="js/hitsound.js?v=49"></script>
<script src="js/settings.js?v=49"></script>
<script src="js/worlds.js?v=49"></script>
<script src="js/bot.js?v=49"></script>
<script src="js/game.js?v=49"></script>
<script src="js/menu.js?v=49"></script>
<script>
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.getElementById('rotate-fullscreen').onclick = () => {
        const el = document.documentElement;
        if (el.requestFullscreen)
            el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => { });
    };
    document.getElementById('rotate-skip').onclick = () => document.body.classList.add('portrait-ok');
</script>
</body>
</html>
